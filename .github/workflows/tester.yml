name: Tester

# Kör Playwright-testerna vid varje commit och publicerar appen + testrapporten
# till GitHub Pages: appen på /elkoll/ och rapporten på /elkoll/rapport/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-och-publicera:
    name: Testa och publicera
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Playwrights officiella image har WebKit och Chromium färdiginstallerade – ingen
    # installation som kan hänga sig. Versionen måste matcha @playwright/test i package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      HOME: /root
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}rapport/

    steps:
      - uses: actions/checkout@v4

      - name: Installera beroenden
        run: npm ci

      - name: Kontrollera att testplanen stämmer med testerna
        run: node tests/kontrollera-testplan.js

      - name: Hämta tidigare körningar till trenden
        run: |
          mkdir -p rapport
          node -e "fetch('https://dennishoglund.github.io/elkoll/rapport/historik.json').then(r => r.ok ? r.text() : '[]').catch(() => '[]').then(t => require('fs').writeFileSync('rapport/historik.json', t))"

      - name: Kör Playwright-testerna
        id: tester
        continue-on-error: true
        run: npx playwright test

      - name: Bygg sidan (app + rapport)
        if: always()
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude ./_site --exclude ./.git --exclude ./.github --exclude ./node_modules \
            --exclude ./tests --exclude ./test-results --exclude ./rapport --exclude ./supabase --exclude ./docs \
            --exclude ./package.json --exclude ./package-lock.json --exclude ./playwright.config.js \
            --exclude ./README.md --exclude ./SPEC.md --exclude ./testplan --exclude ./CLAUDE.md --exclude ./AGENTS.md --exclude ./.gitignore \
            . | tar -xf - -C _site
          cp -r rapport _site/rapport
          touch _site/.nojekyll

      - name: Spara rapporten som artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrapport
          path: rapport/
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicera på GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Markera commit som röd om tester misslyckades
        if: steps.tester.outcome == 'failure'
        run: |
          node -e '
            const r = require("./rapport/resultat.json");
            JSON.stringify(r, (k, v) => {
              if (v && v.perProjekt) for (const [p, x] of Object.entries(v.perProjekt)) {
                if (x.status === "unexpected") console.log("::error title=" + p + " – " + v.namn + "::" + (x.fel || []).join(" | ").replace(/\s+/g, " ").slice(0, 700));
              }
              return v;
            });
          ' || true
          echo "::error::Testerna misslyckades – se https://dennishoglund.github.io/elkoll/rapport/"
          exit 1
